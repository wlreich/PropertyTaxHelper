name: Migration-gated web release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verify deployment order in nonproduction before production
        required: true
        type: choice
        options: [nonproduction, production]

permissions:
  contents: read

concurrency:
  group: parcelsavvy-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migration-and-contract:
    name: Required migrations and database contract
    if: inputs.target == 'nonproduction' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-${{ inputs.target }}
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.complete.outputs.gate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read migration history without applying DDL
        env:
          RELEASE_DATABASE_URL: ${{ secrets.RELEASE_DATABASE_URL }}
        run: |
          test -n "$RELEASE_DATABASE_URL" || { echo 'RELEASE_DATABASE_URL is not configured for this environment' >&2; exit 1; }
          psql "$RELEASE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc \
            'select version from supabase_migrations.schema_migrations order by version' > "$RUNNER_TEMP/applied-migrations.txt"
      - name: Require migration parity
        run: node tools/release-contract/check-migration-parity.mjs "$RUNNER_TEMP/applied-migrations.txt"
      - name: Check the published database contract before web deployment
        env:
          RELEASE_SUPABASE_URL: ${{ vars.RELEASE_SUPABASE_URL }}
          RELEASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RELEASE_SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/release-contract/smoke-published-release.mjs
      - id: complete
        run: echo 'gate=passed' >> "$GITHUB_OUTPUT"

  deploy-and-smoke:
    name: Deploy web only after database gate
    needs: migration-and-contract
    if: needs.migration-and-contract.outputs.gate == 'passed'
    runs-on: ubuntu-24.04
    environment: release-${{ inputs.target }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web
      - name: Deploy gated commit
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          test -n "$VERCEL_TOKEN" -a -n "$VERCEL_ORG_ID" -a -n "$VERCEL_PROJECT_ID" || { echo 'Vercel release credentials are not configured' >&2; exit 1; }
          flags=()
          if [ "$TARGET" = production ]; then flags+=(--prod); fi
          url=$(npx --yes vercel@50.1.6 deploy --yes "${flags[@]}" --token "$VERCEL_TOKEN")
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Check RPC and rendered screen/print contracts
        env:
          RELEASE_SUPABASE_URL: ${{ vars.RELEASE_SUPABASE_URL }}
          RELEASE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.RELEASE_SUPABASE_PUBLISHABLE_KEY }}
          RELEASE_WEB_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: node tools/release-contract/smoke-published-release.mjs
