name: TCAD ingestion checks
on:
  pull_request:
    paths:
      - "tools/ingestion/**"
      - "supabase/migrations/**"
      - ".github/workflows/tcad-import.yml"
      - ".github/workflows/tcad-ingestion-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingestion-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: tcad-local-test-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r tools/ingestion/requirements-job.txt
      - name: Test importer
        run: python -m unittest discover -s tools/ingestion/tests -v
      - name: Test the complete job against disposable PostgreSQL
        env:
          TCAD_TEST_DATABASE_URL: postgresql://postgres:tcad-local-test-only@localhost:5432/postgres?sslmode=disable
        run: python tools/ingestion/tests/job_integration_check.py
